services:
  postgres:
    image: postgres:16
    container_name: rides-postgres
    environment:
      POSTGRES_USER: rides
      POSTGRES_PASSWORD: rides
      POSTGRES_DB: rides
    ports:
      - "5432:5432"
    volumes:
      - rides-postgres-data:/var/lib/postgresql/data
      - ../../services/api/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rides -d rides"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: rides-api
    environment:
      PORT: 8080
      LOG_LEVEL: debug
      DATABASE_URL: postgres://rides:rides@postgres:5432/rides?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: rides-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  rides-postgres-data:
