# Custom values for Grafana Helm Chart
# This file overrides default settings without rewriting the Kubernetes manifests.

adminPassword: admin

# Disable persistent storage for learning (resources are cleaned up when deleted)
persistence:
  enabled: false

# Automatically configure Prometheus as the default data source in Grafana
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-server.monitoring.svc.cluster.local:80
      isDefault: true

# Provision a local dashboard from Helm values so Grafana starts with an
# API-focused view ready for this learning project.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: default
      orgId: 1
      folder: ""
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    rides-overview:
      json: |
